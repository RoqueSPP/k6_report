<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gerenciador de Testes — Test Manager</title>
  <style>
    :root{ --bg:#f4f6f8; --card:#ffffff; --accent:#2b6cb0; --muted:#6b7280; --success:#16a34a; --danger:#dc2626; }
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);margin:0;padding:24px;color:#111}
    .container{max-width:1100px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .controls{display:flex;gap:8px}
    .card{background:var(--card);padding:16px;border-radius:12px;box-shadow:0 4px 20px rgba(15,23,42,0.06);margin-bottom:16px}

    form .row{display:flex;gap:8px;margin-bottom:8px}
    input[type=text], textarea, select{padding:8px;border-radius:8px;border:1px solid #e6e9ee;width:100%;font-size:14px}
    textarea{min-height:60px;resize:vertical}
    button{background:var(--accent);color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.ghost{background:transparent;color:var(--accent);border:1px solid rgba(43,108,176,0.12)}
    .steps{margin-top:12px}
    .step{border:1px dashed #e2e8f0;padding:10px;border-radius:10px;margin-bottom:8px;display:grid;grid-template-columns:120px 1fr 120px;gap:8px;align-items:start}
    .step .meta{display:flex;flex-direction:column;gap:6px}
    .step-type{padding:8px;border-radius:8px;border:1px solid #eef2ff;background:#f8fafc;font-weight:600}
    .step-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
    .thumb{max-width:100%;height:80px;object-fit:cover;border-radius:6px;border:1px solid #e5e7eb}

    .summary{display:flex;gap:12px;align-items:center}
    .summary .badge{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid #eef2ff}

    .chart-wrap{width:320px;height:200px}

    .scenario-list{display:grid;grid-template-columns:1fr 360px;gap:12px}
    .scenarios{max-height:380px;overflow:auto}
    .scenario-item{padding:10px;border-radius:8px;border:1px solid #eef2f6;margin-bottom:8px;background:#fff}

    footer{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

    /* report preview */
    .report-preview{max-height:420px;overflow:auto;border:1px solid #e6eef6;padding:12px;border-radius:8px;background:#fff}

    @media (max-width:900px){.step{grid-template-columns:1fr}.scenario-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gerenciador de Testes — Criar cenários e steps</h1>
      <div class="controls">
        <button id="btn-export" class="ghost">Gerar Report (HTML)</button>
        <button id="btn-download" class="ghost">Download HTML</button>
      </div>
    </header>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Novo Cenário</h2>
      <div style="display:flex;gap:12px;flex-direction:column">
        <input id="scenario-title" type="text" placeholder="Título do cenário (ex: Login com sucesso)" />
        <textarea id="scenario-desc" placeholder="Descrição opcional do cenário"></textarea>
        <div style="display:flex;gap:8px;align-items:center">
          <label for="step-type">Tipo do próximo step</label>
          <select id="step-type" style="max-width:160px">
            <option>Dado</option>
            <option>Quando</option>
            <option>Então</option>
            <option>E</option>
          </select>
          <input id="step-text" type="text" placeholder="Texto do step" />
          <input id="step-image" type="file" accept="image/*" />
          <button id="add-step">Adicionar Step</button>
        </div>

        <div class="steps card" id="steps-area">
          <!-- steps serão inseridos aqui -->
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="display:flex;gap:8px;align-items:center">
            <label>Status do cenário:</label>
            <select id="scenario-status"><option>Não executado</option><option>Passou</option><option>Falhou</option></select>
          </div>
          <div>
            <button id="save-scenario">Salvar Cenário</button>
          </div>
        </div>
      </div>
    </section>

    <section class="card scenario-list">
      <div>
        <h3>Cenários</h3>
        <div class="scenarios" id="scenarios-list">
          <!-- lista de cenários -->
        </div>
      </div>

      <div>
        <h3>Resumo</h3>
        <div class="card report-preview">
          <div class="summary">
            <div class="badge">Total: <span id="total">0</span></div>
            <div class="badge">Passou: <span id="passed">0</span></div>
            <div class="badge">Falhou: <span id="failed">0</span></div>
          </div>
          <div style="margin-top:12px">
            <canvas id="pvChart" width="320" height="200"></canvas>
          </div>
          <div style="margin-top:12px">
            <h4>Preview do próximo report</h4>
            <div id="report-html-preview" style="font-family:monospace;font-size:12px;white-space:pre-wrap"></div>
          </div>
        </div>
      </div>
    </section>

    <footer>
      <button id="clear-all" class="ghost">Limpar tudo</button>
      <button id="open-report">Abrir ultimo report</button>
    </footer>
  </div>

  <!-- Chart.js CDN (apenas para visual) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Estruturas em memória
    const scenarios = [];
    let lastReportHtml = '';

    // helpers
    function uid(){ return Math.random().toString(36).slice(2,9) }
    function nowISO(){ return new Date().toISOString() }

    // DOM refs
    const stepsArea = document.getElementById('steps-area');
    const addStepBtn = document.getElementById('add-step');
    const stepType = document.getElementById('step-type');
    const stepText = document.getElementById('step-text');
    const stepImage = document.getElementById('step-image');
    const scenarioTitle = document.getElementById('scenario-title');
    const scenarioDesc = document.getElementById('scenario-desc');
    const saveScenario = document.getElementById('save-scenario');

    const scenariosList = document.getElementById('scenarios-list');
    const totalEl = document.getElementById('total');
    const passedEl = document.getElementById('passed');
    const failedEl = document.getElementById('failed');
    const previewEl = document.getElementById('report-html-preview');

    const scenarioStatus = document.getElementById('scenario-status');

    let stagedSteps = [];

    function renderSteps(){
      stepsArea.innerHTML = '';
      stagedSteps.forEach(s => {
        const el = document.createElement('div'); el.className='step';
        el.innerHTML = `
          <div class="meta">
            <div class="step-type">${s.type}</div>
            <div style="font-size:12px;color:var(--muted)">${s.time}</div>
          </div>
          <div>
            <div style="font-weight:600">${escapeHtml(s.text)}</div>
            ${s.img ? `<img src="${s.img}" class="thumb"/>` : ''}
          </div>
          <div class="step-actions">
            <select data-id="${s.id}" class="step-status">
              <option value="not">Não executado</option>
              <option value="passed">Passou</option>
              <option value="failed">Falhou</option>
            </select>
            <button data-id="${s.id}" class="remove-step ghost">Remover</button>
          </div>
        `;
        stepsArea.appendChild(el);
      })
    }

    // add step
    addStepBtn.addEventListener('click', async (e)=>{
      const text = stepText.value.trim();
      if(!text){ alert('Preencha o texto do step'); return }
      let imgData = null;
      if(stepImage.files && stepImage.files[0]){
        imgData = await fileToDataUrl(stepImage.files[0]);
      }
      const s = { id: uid(), type: stepType.value, text, img: imgData, time: nowISO(), status: 'not' };
      stagedSteps.push(s);
      stepText.value=''; stepImage.value='';
      renderSteps();
    })

    // delegate remove/changes
    stepsArea.addEventListener('click', e=>{
      if(e.target.matches('.remove-step')){
        const id = e.target.dataset.id;
        stagedSteps = stagedSteps.filter(x=>x.id!==id);
        renderSteps();
      }
    })
    stepsArea.addEventListener('change', e=>{
      if(e.target.matches('.step-status')){
        const id = e.target.dataset.id; const val = e.target.value;
        const st = stagedSteps.find(x=>x.id===id); if(st) st.status = val;
      }
    })

    // save scenario
    saveScenario.addEventListener('click', ()=>{
      const title = scenarioTitle.value.trim();
      if(!title){ alert('Preencha o título do cenário'); return }
      const sc = {
        id: uid(), title, desc: scenarioDesc.value||'', created: nowISO(), steps: JSON.parse(JSON.stringify(stagedSteps)), status: scenarioStatus.value
      };
      // infer status by steps if not manually set
      const anyFailed = sc.steps.some(s=>s.status==='failed');
      if(anyFailed) sc.status='Falhou';
      const allPassed = sc.steps.length>0 && sc.steps.every(s=>s.status==='passed');
      if(allPassed) sc.status='Passou';

      scenarios.unshift(sc);
      stagedSteps = [];
      scenarioTitle.value=''; scenarioDesc.value=''; scenarioStatus.value='Não executado';
      renderSteps(); renderScenarios(); updateSummary();
    })

    function renderScenarios(){
      scenariosList.innerHTML='';
      scenarios.forEach(s=>{
        const item = document.createElement('div'); item.className='scenario-item';
        item.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div><strong>${escapeHtml(s.title)}</strong><div style="font-size:12px;color:var(--muted)">${s.created}</div></div>
            <div style="text-align:right">
              <div style="font-weight:700">${s.status}</div>
              <div style="margin-top:6px"><button data-id="${s.id}" class="view-scn ghost">Ver</button> <button data-id="${s.id}" class="del-scn ghost">Excluir</button></div>
            </div>
          </div>
        `;
        scenariosList.appendChild(item);
      })
    }

    scenariosList.addEventListener('click', e=>{
      if(e.target.matches('.view-scn')){
        const id = e.target.dataset.id; const sc = scenarios.find(x=>x.id===id); if(!sc) return;
        showScenarioDetail(sc);
      }
      if(e.target.matches('.del-scn')){
        const id = e.target.dataset.id; if(!confirm('Excluir cenário?')) return; const idx = scenarios.findIndex(x=>x.id===id); if(idx>-1) scenarios.splice(idx,1); renderScenarios(); updateSummary();
      }
    })

    function showScenarioDetail(sc){
      const html = generateReportHtml([sc]);
      const w = window.open('','_blank'); w.document.write(html); w.document.close();
    }

    // summary + chart
    const ctx = document.getElementById('pvChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels:['Passou','Falhou'], datasets:[{data:[0,0],backgroundColor:['#16a34a','#dc2626']}] },
      options: { responsive:true, maintainAspectRatio:false }
    });

    function updateSummary(){
      const total = scenarios.length;
      const passed = scenarios.filter(s=>s.status==='Passou').length;
      const failed = scenarios.filter(s=>s.status==='Falhou').length;
      totalEl.textContent=total; passedEl.textContent=passed; failedEl.textContent=failed;
      chart.data.datasets[0].data = [passed, failed]; chart.update();
      // atualizar preview do report
      lastReportHtml = generateReportHtml(scenarios);
      previewEl.textContent = lastReportHtml.slice(0,400) + (lastReportHtml.length>400? '\n\n... (preview truncado)':'')
    }

    // generate report as HTML
    function generateReportHtml(list){
      const date = new Date().toLocaleString();
      const total = list.length;
      const passed = list.filter(s=>s.status==='Passou').length;
      const failed = list.filter(s=>s.status==='Falhou').length;
      const rows = list.map(s=>{
        return `
          <section style="border:1px solid #e6eef6;padding:10px;margin-bottom:12px;border-radius:6px">
            <h3>${escapeHtml(s.title)} <small style=\"color:#6b7280;font-weight:400\">- ${s.created}</small></h3>
            <p style=\"color:#374151\">${escapeHtml(s.desc||'')}</p>
            <div style=\"margin-top:8px\">${s.steps.map(st=>`
              <div style=\"padding:6px;border-radius:6px;margin-bottom:6px;background:#fbfdff;border:1px solid #eef6ff\">
                <div style=\"font-weight:700\">${st.type} ${escapeHtml(st.text)}</div>
                ${st.img?`<div style=\"margin-top:6px\"><img src=\"${st.img}\" style=\"max-width:320px;border-radius:6px;border:1px solid #e6eef6\"/></div>`:''}
                <div style=\"font-size:12px;color:#6b7280;margin-top:6px\">Status: ${st.status}</div>
              </div>`).join('')} 
            </div>
            <div style=\"margin-top:8px;font-weight:700\">Resultado do cenário: ${s.status}</div>
          </section>`
      }).join('\n');

      return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"/><title>Report - ${date}</title><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;padding:18px;color:#111}h1{font-size:18px}img{max-width:100%}</style></head><body><header><h1>Relatório de Testes</h1><div>Gerado: ${date}</div><div>Total: ${total} — Passou: ${passed} — Falhou: ${failed}</div><hr/></header><main>${rows}</main></body></html>`
    }

    // export / download
    document.getElementById('btn-export').addEventListener('click', ()=>{
      lastReportHtml = generateReportHtml(scenarios);
      const w = window.open('','_blank'); w.document.write(lastReportHtml); w.document.close();
    })

    document.getElementById('btn-download').addEventListener('click', ()=>{
      lastReportHtml = generateReportHtml(scenarios);
      const blob = new Blob([lastReportHtml], {type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download = `report-${new Date().toISOString().slice(0,19)}.html`; a.click(); URL.revokeObjectURL(url);
    })

    document.getElementById('open-report').addEventListener('click', ()=>{
      if(!lastReportHtml){ alert('Nenhum report gerado ainda. Salve ou clique em "Gerar Report"'); return }
      const w = window.open('','_blank'); w.document.write(lastReportHtml); w.document.close();
    })

    document.getElementById('clear-all').addEventListener('click', ()=>{ if(confirm('Limpar cenários?')){scenarios.length=0; stagedSteps=[]; renderSteps(); renderScenarios(); updateSummary();}})

    // small util para transformar file em dataURL
    function fileToDataUrl(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload=e=>res(e.target.result); r.onerror=err=>rej(err); r.readAsDataURL(file); }) }
    function escapeHtml(unsafe){ return (unsafe||'').toString().replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c] }); }

    // initial render
    renderSteps(); renderScenarios(); updateSummary();
  </script>
</body>
</html>
